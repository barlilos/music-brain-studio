appId: com.barlilos.musicbrainstudio
productName: Music Brain Studio

directories:
  output: release

# Only the compiled output and the manifest need to ship. Everything under
# src/ has already been bundled into out/ by electron-vite.
files:
  - out/**
  - package.json

win:
  target: nsis

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

mac:
  target: dmg
  category: public.app-category.music

linux:
  target: AppImage
  category: Audio
