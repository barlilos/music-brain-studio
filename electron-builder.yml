appId: com.barlilos.musicbrainstudio
productName: Music Brain Studio

directories:
  output: release

# Only the compiled output and the manifest need to ship. Everything under
# src/ has already been bundled into out/ by electron-vite.
files:
  - out/**
  - package.json

# The default project is data, not code, so it ships beside the asar archive
# rather than inside it. `defaultProjectPath` in src/main/ipc/project.ts looks
# for it under `process.resourcesPath`, which is where this puts it — keep the
# two in step.
extraResources:
  - from: data
    to: data

win:
  target: nsis

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

mac:
  target: dmg
  category: public.app-category.music

linux:
  target: AppImage
  category: Audio
